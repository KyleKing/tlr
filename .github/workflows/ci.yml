name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: deno install

      - name: Run Tests
        run: deno task test

      - name: Type Check
        run: deno task check

      - name: Check Format
        run: deno task fmt --check

      - name: Lint
        run: deno task lint

      - name: Check Biome
        run: deno task biome check

      - name: Install Playwright browser for headless Chrome (fastest install)
        run: deno run --allow-all npm:playwright install chromium --only-shell
      - name: Run e2e Tests
        run: deno task test:e2e --project=chrome
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 1
