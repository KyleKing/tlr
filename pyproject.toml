[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx>=0.28.1",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.2.1",
  "pytest-randomly>=4.0.1",
  "pytest-recording>=0.13.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.11.10",
  "types-pyyaml>=6.0.12.20250915",
]

[project]
name = "tlr"
version = "0.1.0"
description = "Tech Lead Reporter - Generate progress reports from Linear, Jira, and more"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.0.0",
]

[project.scripts]
tlr = "tlr.cli:main"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]
extra_checks = true
files = ["tests", "src/tlr"]
no_implicit_reexport = true
python_version = "3.12"
show_column_numbers = true
show_error_codes = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "tests --strict-markers --durations=5 --timeout=10"
markers = [
  "slow: slow integration tests",
  "vcr: tests using pytest-recording",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]
source = ["tlr"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.lint]
ignore = [
  'ANN002',  # Missing type annotation for `*args`
  'ANN003',  # Missing type annotation for `**kwargs`
  'ANN401',  # Dynamically typed expressions (typing.Any) are disallowed
  'BLE001',  # Do not catch blind exception: `Exception`
  'COM812',  # Trailing comma (conflicts with formatter)
  'CPY001',  # Missing copyright notice
  'D203',    # 1 blank line before class docstring (conflicts with D211)
  'D213',    # Multi-line docstring summary second line (conflicts with D212)
  'DOC201',  # Return not documented (type hints are sufficient)
  'DOC501',  # Raised exception missing from docstring
  'EM101',   # Exception must not use string literal
  'EM102',   # Exception must not use f-string literal
  'FIX001',  # Line contains FIXME
  'FIX002',  # Line contains TODO
  'FIX004',  # Line contains HACK
  'PLR0913', # Too many arguments
  'TD001',   # Invalid TODO tag
  'TD002',   # Missing author in TODO
  'TD003',   # Missing issue link
  'TRY003',  # Avoid specifying long messages outside exception class
]
preview = true
select = ['ALL']
unfixable = [
  'ERA001',  # Commented out code
  'T201',    # print
]

[tool.ruff.lint.isort]
known-first-party = ['tlr']

[tool.ruff.lint.per-file-ignores]
'src/tlr/cli.py' = [
  'T201',    # print allowed (CLI output)
]
'src/tlr/linear/client.py' = [
  'ARG001',  # Unused argument (issue kept for context/future use)
  'C901',    # Complex function (_compute_issue_changes, acceptable)
  'PLR0912', # Too many branches (transformation logic, acceptable)
  'PLR0915', # Too many statements (transformation logic, acceptable)
  'PLR0917', # Too many positional arguments (transformation function, acceptable)
  'TC003',   # Type checking block (datetime used at runtime)
]
'src/tlr/linear/models.py' = [
  'TC003',   # Type checking block (datetime used by Pydantic at runtime)
]
'src/tlr/models.py' = [
  'TC003',   # Type checking block (datetime used at runtime)
]
'src/tlr/reporters/markdown.py' = [
  'FURB113', # Use extend (append is clearer for single items)
  'PERF401', # Use extend (not applicable, transforming each item)
  'PLR0911', # Too many returns (formatting function, acceptable)
  'TC001',   # Type checking block (models used at runtime)
]
'src/tlr/secrets.py' = [
  'S404',    # subprocess module (required for Mac Keychain)
  'S603',    # subprocess call (Mac Keychain, trusted)
  'S607',    # partial executable path (Mac Keychain security command)
  'T201',    # print allowed (user interaction)
  'TRY300',  # else block (clearer as-is for error handling)
]
'tests/*.py' = [
  'ANN001',  # Missing type annotation for function argument
  'ANN201',  # Missing return type annotation for public function
  'ANN202',  # Missing return type annotation for private function
  'ARG001',  # Unused function argument
  'ARG002',  # Unused method argument
  'D100',    # Missing docstring in public module
  'D101',    # Missing docstring in public class
  'D102',    # Missing docstring in public method
  'D103',    # Missing docstring in public function
  'DOC201',  # `return` is not documented in docstring
  'PLC2701', # Private name import
  'PLR6301', # Method could be a function
  'S101',    # Use of `assert` detected
]
'tlr-linear_progress.py' = ['ALL']  # Old script, ignore all

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
required-version = ">=0.8.22"
