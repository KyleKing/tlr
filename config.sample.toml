# tlr configuration sample.
#
# Copy this file to the path `get_default_config_path()` returns (the XDG config
# directory for "tlr", or $TLR_CONFIG when set) and edit it for your workspace.
# No table or key is required: whatever you omit takes its default from
# `tlr/config.py`, which for a list or string is usually empty. The values below
# are illustrative. An unrecognized key raises an error naming it.
#
# Table and array order carries meaning here (priority order, tier order, age
# buckets ascending), so this file is excluded from toml-sort in .pre-commit-config.yaml.

[linear]
# Team keys to ingest, the "ENG" in ENG-123. Empty means every team in scope.
team_keys = ["ENG"]
# Project names or slug ids to ingest. Empty means every project in scope.
project_names = ["Roadmap"]
# The workspace's URL key: the segment right after linear.app/ in any workspace link.
workspace_url_key = "example-workspace"
# Linear account names or emails that are agents, not humans, so triage can skip a
# row an agent already owns instead of surfacing it for a person.
agent_accounts = ["watch-doggo@example.com"]
# Point values tried when Linear's own estimate scale can't be read from the API.
estimate_scale = [0, 1, 2, 3, 5, 8, 13]
# Status names treated as closed for the snapshot's open counts, on top of a completed or
# canceled state. Most workspaces don't need this: Linear sets canceledAt on entering a
# "Duplicate" state too, so it is already excluded. Use this only for a status your
# completedAt/canceledAt check misses.
closed_like_state_names = []
# Label marking an issue as bot-filed (e.g. an automated monitoring alert). The snapshot
# reports it as its own row instead of folding it into the human backlog count. Empty
# (the default) means no split is computed.
bot_label = ""

[pylon]
# Pylon custom field that holds the linked Linear issue identifier.
linear_ticket_field = "linear_ticket"
# Pylon custom field that holds the ticket's priority.
priority_field = "priority"
# Priority values, most urgent first. Used both to read a ticket's priority and to
# order the triage queue. These four are what Pylon's own priority select ships.
priority_values = ["urgent", "high", "medium", "low"]
# Pylon custom field holding the question type, used by the exclusion rules below.
question_type_field = "question_type"

# Whether a ticket is waiting on the customer, on us, or closed comes from the status
# category Pylon reports for it, not from a list here.

[sentry]
# Organization slug, the segment right after sentry.io/organizations/ in any org link.
# The auth token is never in this file; it comes from the secret store like every other
# service token (see SETUP.md).
org_slug = "example-org"
# Project slugs to scope issue queries to. Empty means every project in the org.
project_slugs = ["backend"]

[alarms]
# CloudWatch alarms, fetched live by shelling out to an NDJSON alarm exporter such as
# tail-cw's `export alarms --history`. `command` is the argv prefix; tlr appends
# `--profile <name> --history --start <iso> --end <iso>` and reads one JSON object per
# alarm on stdout. Empty command or empty profiles disables the alarm sections.
command = ["uv", "run", "--project", "~/Developer/kyleking/tail-cw", "tail-cw", "export", "alarms"]

# Trailing name tokens that mark severity, e.g. `-critical` in `svc-api-5xx-critical`.
severity_suffixes = ["critical", "warning"]

# AWS region used to turn alarm names into CloudWatch console links in markdown output,
# e.g. "us-east-1". Empty leaves alarm names as plain text.
console_region = ""

# Environment label -> the AWS profile its alarms are fetched under. The label becomes
# the `env` column on every alarm row, which is how the prod/stage split is reported.
[alarms.profiles]
prod = "read-prod"
stage = "read-stage"

# Category name -> glob patterns matched against the alarm name (fnmatch). The first
# category with a matching pattern wins; alarms matching nothing land in
# "uncategorized".
[alarms.categories]
api = ["*-api-*"]
worker = ["*-worker-*"]

[tiers]
# Customer tier names, highest priority first. Empty (the default) means the tier
# ordering rule does nothing.
names = ["enterprise", "standard", "free"]
# Pylon account custom field that holds an account's tier. Pylon ships no tier field,
# so this names whichever account field your workspace uses for it. Unset (the
# default) leaves every account on default_tier.
account_tier_field = "tier"
# Tier assumed for an account with no tier set.
default_tier = "free"

# Target close time, in days, per Pylon priority value. Missing a priority here
# means that priority has no SLA target.
[sla.target_days_by_priority]
urgent = 1
high = 3
medium = 5
low = 10

# Optional target close time, in days, per customer tier, applied alongside the
# priority target. Empty (the default) means tier does not affect the target.
[sla.target_days_by_tier]

[triage]
# Rules applied in sequence when ranking the triage queue.
ordering = ["priority", "tier", "age", "sla_distance"]

# Pylon assignee ids that are agents, not humans, so triage can skip a row an agent
# already owns. The Linear side of this is [linear].agent_accounts.
agent_assignee_ids = []

# Exclusion rules: a row carrying one of these Pylon tags or question types is pulled
# out of the ordering and listed under its own heading instead. The TOML key is the
# heading shown in the queue. Empty (the default) excludes nothing.
[triage.exclusions]
feature_request = ["feature_request"]
config_work = ["config"]

[thresholds]
# Backlog age buckets, in days, for the over-30/60/90-days counts.
backlog_age_days = [30, 60, 90]
# Days in progress before a ticket is flagged as stuck.
in_progress_days = 14
# Commitment accuracy band: a cycle below commitment_accuracy_low under-committed,
# above commitment_accuracy_high over-committed.
commitment_accuracy_low = 0.8
commitment_accuracy_high = 0.9

[capacity]
# On-call schedule ids (Incident.io) used to deflate capacity for on-call weeks.
on_call_schedule_ids = ["schedule-primary"]
# Calendar ids checked for out-days and meeting hours.
calendar_ids = ["alex@example.com", "sam@example.com"]
# Which calendar events count as meeting hours. "accepted_from_others" counts
# events organized by someone else that this person accepted.
meeting_hours_rule = "accepted_from_others"
# Working days in one cycle, and hours in one working day. Together they convert an
# out-day, an on-call day, or an hour of meetings into the points it costs.
working_days_per_cycle = 10
working_hours_per_day = 8

# Roster: one table per person, with their points per cycle before deflation.
[[capacity.roster]]
name = "Alex Doe"
email = "alex@example.com"
points_per_cycle = 10

[[capacity.roster]]
name = "Sam Roe"
email = "sam@example.com"
points_per_cycle = 8

[store]
# DuckDB file path. Unset (the default) resolves under get_data_dir(), the
# platform's XDG data directory for "tlr" (or $TLR_DATA_DIR when set).
# database_path = "/path/to/tlr.duckdb"
